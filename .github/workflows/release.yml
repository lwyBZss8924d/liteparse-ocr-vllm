name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.5.3-custom.1"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/custom/vllm-ocr-main' || github.ref == 'refs/tags/v1.5.3-custom.1'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate release package
        run: |
          npm prune --omit=dev
          npm pack --dry-run --json
          npm run smoke:offline-npm-tgz

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          package_name="@zzwz/liteparse-vllm"
          expected_version="1.5.3-custom.1"
          actual_version="$(node -p "require('./package.json').version")"
          test "${actual_version}" = "${expected_version}"

          if npm view "${package_name}@${expected_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${expected_version} is already published; refreshing dist-tags only."
          else
            npm publish --access public --tag latest --provenance
          fi

          npm dist-tag add "${package_name}@${expected_version}" latest
          npm dist-tag add "${package_name}@${expected_version}" custom

      - name: Publish GitHub Packages mirror
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_name="@lwybzss8924d/liteparse-vllm"
          expected_version="1.5.3-custom.1"
          actual_version="$(node -p "require('./package.json').version")"
          test "${actual_version}" = "${expected_version}"

          npmrc="$(mktemp)"
          original_package_json="$(mktemp)"
          cp package.json "${original_package_json}"
          trap 'cp "${original_package_json}" package.json; rm -f "${npmrc}" "${original_package_json}"' EXIT

          {
            echo "@lwybzss8924d:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } > "${npmrc}"
          export NPM_CONFIG_USERCONFIG="${npmrc}"

          if npm view "${package_name}@${expected_version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "${package_name}@${expected_version} is already published to GitHub Packages."
          else
            node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.name = "@lwybzss8924d/liteparse-vllm";
          pkg.publishConfig = {
            ...(pkg.publishConfig ?? {}),
            registry: "https://npm.pkg.github.com",
          };
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
            npm publish --registry=https://npm.pkg.github.com --tag latest
          fi
