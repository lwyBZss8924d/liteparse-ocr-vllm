[project]
name = "glmocr-liteparse"
version = "0.1.0"
description = "GLM-OCR SDK pipeline server for LiteParse"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.132.0",
    "glmocr[selfhosted,server]",
    "pillow>=12.2.0",
    "python-multipart>=0.0.26",
    "uvicorn>=0.41.0",
]

[tool.uv.sources]
glmocr = { path = "../../../GLM-OCR", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
